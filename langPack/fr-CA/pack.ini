quicksetup.lang_wiz_license_agreement_content57=NEITHER YOU NOR LINKSYS SHALL BE ENTITLED TO JOIN OR CONSOLIDATE CLAIMS IN ARBITRATION BY OR AGAINST OTHER CONSUMERS OR ARBITRATE ANY CLAIMS AS A REPRESENTATIVE OR MEMBER OF A CLASS OR IN A PRIVATE ATTORNEY GENERAL CAPACITY. YOU UNDERSTAND THAT WITHOUT THIS PROVISION YOU MAY HAVE HAD A RIGHT TO ARBITRATE A DISPUTE ON A CLASSWIDE OR REPRESENTATIVE BASIS, AND THAT YOU HAVE EXPRESSLY AND KNOWINGLY WAIVED THOSE RIGHTS AND AGREE INSTEAD TO ARBITRATE ONLY YOUR OWN DISPUTE(S) IN ACCORDANCE WITH THE PROVISIONS OF THIS SECTION.
quicksetup.lang_wiz_license_agreement_content58=NOTWITHSTANDING THE ABOVE AGREEMENT TO ARBITRATE DISPUTES, YOU AND LINKSYS EACH ACKNOWLEDGE AND AGREE THAT EITHER PARTY MAY, AS AN ALTERNATIVE TO ARBITRATION, BRING AN INDIVIDUAL ACTION IN SMALL CLAIMS COURT TO RESOLVE A DISPUTE, SO LONG AS SUCH SMALL CLAIMS COURT DOES NOT PROVIDE FOR OR ALLOW FOR JOINDER OR CONSOLIDATION OF CLAIMS.
quicksetup.lang_wiz_license_agreement_content59=THIS AGREEMENT IS TO BE CONSTRUED IN ACCORDANCE WITH AND GOVERNED BY THE INTERNAL LAWS OF THE STATE OF CALIFORNIA WITHOUT GIVING EFFECT TO ANY CHOICE OF LAW RULE THAT WOULD CAUSE THE APPLICATION OF THE LAWS OF ANY JURISDICTION (OTHER THAN THE INTERNAL LAWS OF THE STATE OF CALIFORNIA) TO THE RIGHTS AND DUTIES OF THE PARTIES. HOWEVER, WITH RESPECT TO SOFTWARE PROVIDED, IF YOU ARE A CONSUMER AND YOU LIVE IN A COUNTRY WHERE LINKSYS MARKETS OR PROMOTES THE SOFTWARE, LOCAL LAW MAY REQUIRE THAT CERTAIN CONSUMER PROTECTION LAWS OF YOUR COUNTRY OF RESIDENCE APPLY TO SOME SECTIONS OF THIS AGREEMENT. EACH OF THE UNITED NATIONS CONVENTION ON CONTRACTS FOR THE INTERNATIONAL SALE OF GOODS AND THE UNITED NATIONS CONVENTION ON THE LIMITATION PERIOD IN THE INTERNATIONAL SALE OF GOODS IS HEREBY EXPRESSLY EXCLUDED AND WILL NOT APPLY TO THIS AGREEMENT.
quicksetup.lang_wiz_license_agreement_content60=EXCEPT FOR INDIVIDUAL SMALL CLAIMS ACTIONS WHICH CAN BE BROUGHT IN ANY SMALL CLAIMS COURT WHERE JURISDICTION AND VENUE ARE PROPER, ANY ARBITRATION, LEGAL SUIT, ACTION OR PROCEEDING ARISING OUT OF OR RELATING TO THIS AGREEMENT OR ANY DISPUTE SHALL BE COMMENCED IN (1) NEW YORK, NEW YORK, (2) ATLANTA, GEORGIA, (3) CHICAGO, ILLINOIS, (4) DALLAS, TEXAS, (5) SEATTLE, WASHINGTON, OR (6) LOS ANGELES, CALIFORNIA, AND YOU AND LINKSYS EACH IRREVOCABLY SUBMITS TO THE EXCLUSIVE JURISDICTION AND VENUE OF ANY SUCH PROCEEDING. HOWEVER, FOR A DISPUTE OF $10,000 OR LESS, YOU MAY CHOOSE WHETHER THE ARBITRATION IN ANY OF THE SIX REGIONAL VENUES PROCEEDS IN PERSON, BY TELEPHONE, OR BASED ONLY ON SUBMISSIONS.
quicksetup.lang_wiz_license_agreement_content61=If you are located outside of the United States, the following clause applies to you:
quicksetup.lang_wiz_license_agreement_content62=<b>Governing Law</b>: This Agreement will be governed by California law, without reference to its or any other jurisdiction's conflict of laws principles. The state and federal courts of California shall have non-exclusive jurisdiction over any claim arising under, or in connection with, this Agreement. However, if you are a consumer and you live in a country where Linksys markets or promotes the Software, local law may require that certain consumer protection laws of your country of residence apply to some sections of this Agreement. Each of the United Nations Convention on Contracts for the International Sale of Goods and the United Nations Convention on the Limitation Period in the International Sale of Goods is hereby expressly excluded and will not apply to this Agreement.
quicksetup.lang_wiz_license_agreement_content63=BELKIN, LINKSYS and many product names and logos are trademarks of the Belkin group of companies. Third-party trademarks mentioned are the property of their respective owners.
quicksetup.lang_wiz_license_agreement_content64=2019 Belkin International, Inc. and/or its affiliates. All rights reserved.
quicksetup.lang_wiz_privacy_policy_title=Privacy Policy
quicksetup.lang_wiz_privacy_policy_subtitle=Please read and accept the Privacy Policy.
quicksetup.lang_wiz_privacy_policy_content1=We at Belkin are committed to protecting your privacy. Our goal is to provide you with a positive experience on our websites and when using our apps, products and services, while at the same time keeping your Personal Information, as defined below, secure. Our privacy practices are described below, as well as in separate notices given when an app, product or service is purchased or downloaded (our "Privacy Policy"). This Privacy Policy covers all Belkin Products and Belkin websites. By visiting Belkin websites, using Belkin Products or providing us with your Personal Information (as defined below), you are accepting and consenting to the practices, terms and conditions described in this Privacy Policy.
quicksetup.lang_wiz_privacy_policy_content2=Belkin wants to make Belkin websites easy for you to navigate and Belkin Products easy for you to use. We are constantly improving Belkin websites and Belkin Products to make them more user-friendly.
quicksetup.lang_wiz_privacy_policy_content3=For ease of reference, we will use the following terms in this Privacy Policy: "Belkin", "our", "us" or "we" means Belkin International, Inc., including its global subsidiaries and affiliated companies (including Linksys and WeMo). "Belkin websites" include all global Belkin, Linksys and WeMo websites. "Belkin Products" includes all Belkin, Linksys and WeMo branded apps, products and services.
quicksetup.lang_wiz_privacy_policy_content4=If you are in the European Economic Area ("EEA"), the data controller for the purposes of European data protection law is Belkin Limited of Shipton Way, Express Park, Rushden, Northants, NN10 6GL, UK.
quicksetup.lang_wiz_privacy_policy_content5=Types of Information Covered by This Privacy Policy
quicksetup.lang_wiz_privacy_policy_content6=Belkin may collect both Personal Information and Non-Personal Information. "Personal Information" means any information that can be used to identify you. Some examples of Personal Information include your name, address, email address and phone number. "Non-Personal Information" means information that on its own cannot be used to identify you. Some examples of Non-Personal Information include usage data relating to Belkin websites and Belkin Products, language preferences and Belkin website page views.
quicksetup.lang_wiz_privacy_policy_content7=Information may be aggregated and/or anonymized. When information is aggregated, it is combined with information about other customers and users. When information is anonymized, Personal Information is removed from collected data and the remaining portion of the data, containing only Non-Personal Information, is repurposed for internal or external use, such as, for example, to determine how many users of a particular router include an Internet-enabled television in a home network environment, or how many users viewed a particular website video or advertisement. Aggregated information that includes Personal Information is considered Personal Information until it has been anonymized. Anonymized information is considered Non-Personal Information. In general, usage data collected when you visit Belkin websites or use Belkin Products is both aggregated and anonymized so it does not identify you personally and is therefore Non-Personal Information.
quicksetup.lang_wiz_privacy_policy_content8=The Belkin websites and Belkin Products are not directed to, nor does Belkin knowingly collect Personal Information from children under the age of 13. If we are informed that we have collected the Personal Information of a child under the age of 13, we will delete that Personal Information from our systems. If you believe we might have inadvertently collected Personal Information from or about a child under the age of 13, please contact us at privacy@belkin.com.
quicksetup.lang_wiz_privacy_policy_content9=How We Collect Information
quicksetup.lang_wiz_privacy_policy_content10=We may collect and process the following data about you:
quicksetup.lang_wiz_privacy_policy_content11=Information you give us. If you fill in forms on Belkin websites or correspond with us by phone, email or otherwise, you may be providing us with information about you, which may include Personal Information. This includes information you provide when you register on Belkin websites, register or return a Belkin Product, subscribe to any of our services, search for a product, place an order on Belkin websites, participate in discussion forums or other social media functions on Belkin websites, enter a competition, promotion or survey, participate in a training session or other event, download firmware, software and apps, or when you report a problem with Belkin websites or Belkin Products or otherwise request support. Personal Information you give us may include your name, address, email address, phone number and other contact information, financial and credit card information and any other information that can be used to personally identify you.
quicksetup.lang_wiz_privacy_policy_content12=Information we collect about you. We may automatically collect information when you use Belkin websites or Belkin Products, including:
quicksetup.lang_wiz_privacy_policy_content13=Technical information, including the Internet protocol ("IP") address used to connect your computer or other device to the Internet, browser type and version, time zone setting, browser plug-in types and versions, operating system and platform and language preferences. This information is all normally provided by your web browser, and we do not specifically request it.
quicksetup.lang_wiz_privacy_policy_content14=Information about your visit to Belkin websites, including the full Uniform Resource Locators ("URL") clickstream to, through and from Belkin websites (including date and time)\; products you viewed or searched for\; page response times\; download errors\; length of visits to certain pages\; videos watched\; page interaction information (such as scrolling, clicks, and mouse-overs)\; and methods used to browse away from the page.
quicksetup.lang_wiz_privacy_policy_content15=Any phone number or email address used to contact customer support.
quicksetup.lang_wiz_privacy_policy_content16=Usage data about how and when you use Belkin Products, other devices that are connected to Belkin Products and what features of Belkin Products you use.
quicksetup.lang_wiz_privacy_policy_content17=Technical information and data gathered when your Belkin Products are connected to the Internet, such as how many and which devices are connected to your home network, when you use the devices and the amount of network traffic generated. We also collect environmental data when you use certain Belkin Products, such as utility settings, temperature and light readings in the home, motion detection and alarm events.
quicksetup.lang_wiz_privacy_policy_content18=If you consent, certain apps may collect information about your location. If you do not want this information collected, do not consent, or consult your device manual for instructions on how to change location settings.
quicksetup.lang_wiz_privacy_policy_content19=Information we receive from other sources. We work closely with third parties who provide services to us (including, for example, business partners, subcontractors in technical, payment and delivery services, advertising networks, analytics providers, search information providers, credit reference agencies) and we may receive information about you from them.
quicksetup.lang_wiz_privacy_policy_content20=How We Use Information
quicksetup.lang_wiz_privacy_policy_content21=We may use the information we collect for a number of purposes. These purposes will be consistent with the reason you provided the information to us or for a directly related purpose. The uses we make of such information include the following:
quicksetup.lang_wiz_privacy_policy_content22=To set up an account for you on Belkin websites or Belkin Products.
quicksetup.lang_wiz_privacy_policy_content23=To facilitate your purchase and/or download of Belkin Products. To authenticate use of your account or purchases and/or use of a Belkin Product.
quicksetup.lang_wiz_privacy_policy_content24=To register your Belkin Product in our product database.
quicksetup.lang_wiz_privacy_policy_content25=To carry out our obligations arising from any contracts entered into between you and us and to provide you with the information, products and services that you request from us.
quicksetup.lang_wiz_privacy_policy_content26=To assist you with customer support.
quicksetup.lang_wiz_privacy_policy_content27=To communicate about and administer participation in customer promotions and surveys.
quicksetup.lang_wiz_privacy_policy_content28=To provide the Belkin Products you request.
quicksetup.lang_wiz_privacy_policy_content29=To provide you with information about the Belkin Products you use, such as new features, bug fixes, service downtimes or upgrades.
quicksetup.lang_wiz_privacy_policy_content30=To help us develop new Belkin Products and improve current Belkin Products.
quicksetup.lang_wiz_privacy_policy_content31=To provide you, or permit selected third parties to provide you, with information about goods or services we feel may interest you. We (or selected third parties) will contact you by electronic means only if you have opted-in to receive marketing information. "Opt-in" means that you have taken an affirmative action to receive information, such as by checking a box or clicking a button.
quicksetup.lang_wiz_privacy_policy_content32=To notify you about changes to Belkin websites and Belkin Products and changes to our terms, conditions and policies.
quicksetup.lang_wiz_privacy_policy_content33=To administer Belkin websites and Belkin Products for internal operational purposes, including troubleshooting, data and statistical analysis, testing, research and survey purposes.
quicksetup.lang_wiz_privacy_policy_content34=To improve Belkin websites and Belkin Products and to ensure that content is presented in the most effective manner for you and for your computer or device.
quicksetup.lang_wiz_privacy_policy_content35=To ensure the security of Belkin websites and Belkin Products.
quicksetup.lang_wiz_privacy_policy_content36=To monitor and regulate interactive features of Belkin websites and Belkin Products that you may choose to participate in, including online forums and chat rooms relating to Belkin Products.
quicksetup.lang_wiz_privacy_policy_content37=To help you navigate Belkin websites.
quicksetup.lang_wiz_privacy_policy_content38=To help you access and use certain features of Belkin Products remotely and to help you monitor and safeguard your home and home network.
quicksetup.lang_wiz_privacy_policy_content39=To provide you with information and recommendations about Internet and utility usage in your home.
quicksetup.lang_wiz_privacy_policy_content40=To measure or understand the effectiveness of advertising we serve to you and others who visit Belkin websites and to deliver relevant personalized advertising to you and others.
quicksetup.lang_wiz_privacy_policy_content41=To determine which aspects of Belkin websites and Belkin Products are most useful to you and other users of Belkin websites and Belkin Products.
quicksetup.lang_wiz_privacy_policy_content42=Sharing Information
quicksetup.lang_wiz_privacy_policy_content43=Under no circumstances do we rent or sell your Personal Information to third parties for marketing purposes. We only share your Personal Information with third parties for marketing purposes if you have granted us permission to do so. We will ask for your consent, such as by email response, opt-in box or click through agreement acceptance, before we use or share your Personal Information for any purpose other than the reason you provided it or as otherwise provided by this Privacy Policy. We may share Personal Information in the following ways:
quicksetup.lang_wiz_privacy_policy_content44=Within Belkin for purposes of data processing or storage.
quicksetup.lang_wiz_privacy_policy_content45=Within Belkin's corporate group, including with our subsidiaries, affiliated companies and divisions, all of whom may use your information for the purposes disclosed in this Privacy Policy.
quicksetup.lang_wiz_privacy_policy_content46=With business partners, service vendors, authorized third-party agents or contractors to provide a requested service or transaction, including processing orders, hosting websites, storing your information, providing email communications on our behalf and providing customer support. We only provide these third parties with the minimum amount of Personal Information necessary to complete or provide the requested service or transaction, and we do not allow third parties to use your Personal Information for a different purpose than what was disclosed to you.
quicksetup.lang_wiz_privacy_policy_content47=With service providers, advisors or other third parties to the extent reasonably necessary to proceed with the negotiation or completion of a merger, acquisition or sale of all or a portion of our assets. If Belkin merges with or acquires or is acquired by another entity, Personal Information would be transferred as a whole to the successor entity.
quicksetup.lang_wiz_privacy_policy_content48=To comply with the law or legal process (such as responding to subpoenas or court orders), to comply with government reporting obligations and to exercise our legal rights or defend against legal claims.
quicksetup.lang_wiz_privacy_policy_content49=To protect our legal rights or those of others, such as protecting the Belkin brand or investigating violations of Belkin terms of use, violations of law, intellectual property infringement, misuse of Belkin websites, fraud or potential threats to personal safety.
quicksetup.lang_wiz_privacy_policy_content50=In addition, we may share aggregated and anonymized Non-Personal Information, including usage data about Belkin Products, with third parties for a variety of purposes, including to analyze trends about home networking and utility use, to show third parties how their products could work with Belkin Products and to generally improve home networking. We've taken steps to ensure that this information cannot be linked back to you and we require third parties to keep all shared information in its anonymized form.
quicksetup.lang_wiz_privacy_policy_content51=For certain WeMo and Linksys Smart Wi-Fi products, Belkin may provide the opportunity for you to connect and interface Belkin Products with one or more third party products and services, which will involve the exchange of information from your Belkin Product with the third party product or service. Your explicit consent and authorization will be required at the time of connection to the third party product or service, and will be revocable by you at any time. In some cases, if you purchase, use or download a third party product or service that connects to a Belkin Product, you may also be subject to such third party's privacy policy. Belkin is not responsible for the privacy practices of third party partners. If you access a Belkin Product through a third party product in this manner, you consent and agree to the privacy policy of such third party. We encourage you to carefully read the privacy policies and terms of use of any third party products that connect to Belkin Products.
quicksetup.lang_wiz_privacy_policy_content52=Any third parties with whom we share your Personal Information are required to maintain the confidentiality of the information and are prohibited from using it for any other purpose. We will take all reasonable steps to make sure these third parties comply with the same privacy principles that govern our collection of your personal information.
quicksetup.lang_wiz_privacy_policy_content53=When making purchases on the Belkin website stores, Belkin uses a payment processor to verify your payment card information. Your payment card information is passed through to the payment processor and is not collected or stored by Belkin. The payment processor is authorized to use this information only to authenticate your purchase and for no other purpose.
quicksetup.lang_wiz_privacy_policy_content54=Our European website stores are operated by a third-party service provider, Trojan Electronics Ltd. ("Trojan"). Trojan processes your Personal Information solely for the purpose of fulfilling orders placed on our Belkin website stores in Europe, and in accordance with European data protection law.
quicksetup.lang_wiz_privacy_policy_content55=Marketing
quicksetup.lang_wiz_privacy_policy_content56=You have the right to ask us not to process your Personal Information for marketing purposes. We will inform you (before collecting your Personal Information) if we intend to use your Personal Information for marketing purposes, or if we intend to disclose your Personal Information to any third party for marketing purposes.
quicksetup.lang_wiz_privacy_policy_content57=We will always give you choices about your Personal Information. Some choices are presented up front in the form of Opt-in notices or acceptance boxes for marketing to you or sharing your Personal Information with third parties. In certain cases where permitted by law, we also may give you the choice to Opt-out. "Opt-out" means you have already chosen to Opt-in, but you later change your mind. One form of Opt-out is clicking the Unsubscribe link in a marketing email. This will take you off of our marketing email list. Belkin's general policy is to have users Opt-in, rather than Opt-out, to receive marketing information and to allow the sharing of information with third parties. Please note that these Opt-in/Opt-out choices do not apply to the receipt of mandatory website, service or software communications, such as update or downtime information, or receipt of order or shipping confirmations on Belkin website stores, which you may receive periodically unless you cancel your service or order or terminate use of software in accordance with the applicable terms of use or license agreement.
quicksetup.lang_wiz_privacy_policy_content58=If you do not wish to receive direct marketing material from us or a third party, in addition to following the "Unsubscribe" instructions in a marketing email, you can send us an email request at privacy@belkin.com.
quicksetup.lang_wiz_privacy_policy_content59=New Belkin Products
quicksetup.lang_wiz_privacy_policy_content60=When you purchase and/or download new Belkin Products, we will only use your Personal Information for the purposes set out (i) in this Privacy Policy and (ii) in any notification provided to you at the time of purchase or download.
quicksetup.lang_wiz_privacy_policy_content61=Where We Store Your Information
quicksetup.lang_wiz_privacy_policy_content62=The data that we collect from you may be transferred to, and stored at, various locations globally, including the United States. It may also be processed by Belkin staff or contractors operating outside your country of residence (including, if you are in Europe, outside of the EEA, or, if you are in Australia or New Zealand (ANZ), outside of ANZ) who work for us or for one of our suppliers. Such staff may be engaged in, among other things, the fulfilment of your order, the processing of your payment details and the provision of support services. We also use cloud-based applications and services to store and process your Personal Information, which may result in your Personal Information being stored outside your country of residence (or the EEA or ANZ).
quicksetup.lang_wiz_privacy_policy_content63=We will take such steps as are reasonable to make sure we and our service providers do not breach the privacy principles that govern our collection of your personal information. By providing your Personal Information to us, you fully understand and consent to the transfer, processing and storage of Personal Information outside of your country of residence where data protection standards may be different, and yo consent to disclosure and use of your Personal Information to overseas service providers who may not fully comply with the particular laws of your country. Our Privacy Policy and our practices are designed to provide a globally consistent level of protection for Personal Information all over the world. This means that even in countries whose laws provide for less protection for your information, Belkin will still handle your information in the manner described in this Privacy Policy and in conformity with all applicable laws.
quicksetup.lang_wiz_privacy_policy_content64=Accessing and Updating Your Personal Information
quicksetup.lang_wiz_privacy_policy_content65=We need your help in keeping your Personal Information accurate and up to date, so please notify us of any changes to your Personal Information. You can access and update your Personal Information and communication preferences at any time in the following ways:
quicksetup.lang_wiz_privacy_policy_content66=By clicking the "Unsubscribe" link in any email you receive from us.
quicksetup.lang_wiz_privacy_policy_content67=By sending an email to privacy@belkin.com. Please be sure to include your name, email address and specific relevant information about the information you would like to change or the material that you no longer wish to receive.
quicksetup.lang_wiz_privacy_policy_content68=For many Belkin websites and Belkin Products, by signing in to your online account located at the URL provided when you signed up for the Belkin website or service.
quicksetup.lang_wiz_privacy_policy_content69=We will honor your reasonable request to:
quicksetup.lang_wiz_privacy_policy_content70=Correct your data if it is inaccurate.
quicksetup.lang_wiz_privacy_policy_content71=Transfer your Personal Information to a third party.
quicksetup.lang_wiz_privacy_policy_content72=Delete your Personal Information, unless we are required to retain it by law.
quicksetup.lang_wiz_privacy_policy_content73=Provide you with a copy of Personal Information held on our current records at no charge, or for a reasonable charge if records must be accessed from backed up or archived records.
quicksetup.lang_wiz_privacy_policy_content74=We will respond to your request promptly upon receipt. We may ask you to verify your identity before we can act on your request. If your Personal Information has been disclosed to a third party in accordance with this Privacy Policy, we will take reasonable steps to notify the third party of any updated information you provide to us.
quicksetup.lang_wiz_privacy_policy_content75=We note again that, if you choose to no longer receive marketing information from us, we may still communicate with you about other matters, such as product and service updates for Belkin Products you have purchased and customer support matters.
quicksetup.lang_wiz_privacy_policy_content76=Retention of Personal Information
quicksetup.lang_wiz_privacy_policy_content77=We will only retain your Personal Information to fulfill the purposes for which it was collected or as required for legitimate business purposes as described in this Privacy Policy or otherwise as permitted by law.
quicksetup.lang_wiz_privacy_policy_content78=Cookies, Web Beacons and Other Web Tools
quicksetup.lang_wiz_privacy_policy_content79=We use automatic data collection tools like cookies, embedded web links and widgets (collectively, "web tools"). These web tools collect certain information that your browser or your mobile device sends to Belkin websites and Belkin Products, such as computer IP address, browser type and service provider. In addition, Belkin uses small pieces of code called web beacons. Web beacons allow a website to transfer or collect information through a graphic image request. This allows Belkin to collect information such as the address of the page you are visiting, the address of the referring page you previously visited, what browser or mobile device you are using, and your display settings. Belkin and its advertising partners use web beacons, for example, to find out if advertising on Belkin websites and other websites that contain Belkin ads is effective, or if certain videos on Belkin websites are being viewed.
quicksetup.lang_wiz_privacy_policy_content80=Belkin may use web tools for the following purposes:
quicksetup.lang_wiz_privacy_policy_content81=To identify the user's country and language and distinguish you from other users of Belkin websites.
quicksetup.lang_wiz_privacy_policy_content82=To save your registration information for future use on Belkin websites and services.
quicksetup.lang_wiz_privacy_policy_content83=To allow customer surveys to appear or not appear to customers.
quicksetup.lang_wiz_privacy_policy_content84=To optimize your browsing experience by preloading certain features of Belkin websites and services on future visits to make loading times faster and more efficient.
quicksetup.lang_wiz_privacy_policy_content85=To understand how you use and interact with Belkin websites and services.
quicksetup.lang_wiz_privacy_policy_content86=To customize and provide you with a more personal experience when visiting Belkin websites or our advertising partners' websites or when using Belkin Products.
quicksetup.lang_wiz_privacy_policy_content87=To improve Belkin websites and services.
quicksetup.lang_wiz_privacy_policy_content88=To count visitors to Belkin websites and Belkin Products and analyze website traffic, such as how many visitors have come to the Belkin websites from advertisements on advertising partner websites.
quicksetup.lang_wiz_privacy_policy_content89=You have the following choices regarding Belkin's use of web tools:
quicksetup.lang_wiz_privacy_policy_content90=You may refuse to accept cookies by activating the appropriate setting on your browser or mobile device. However, many features of Belkin websites and Belkin Products may not work as intended if you disable cookies, and areas that require registration or authentication and Belkin website store transactions will not be accessible.
quicksetup.lang_wiz_privacy_policy_content91=For some Belkin Products, you can go into the account settings and select an option that will remove you from personalized advertising. If you select this option, you will receive generic advertising as part of these Belkin Products rather than advertising that has been tailored based on your preferences.
quicksetup.lang_wiz_privacy_policy_content92=Many advertising companies are members of the Digital Advertising Alliance or the Network Advertising Initiative and provide opt-out choices on their websites.
quicksetup.lang_wiz_privacy_policy_content93=We do not currently respond to web browser "do not track" signals or other mechanisms that provide a method to opt out of the collection of information across the networks of websites and online services in which we participate. If we do so in the future, we will describe how we do so in this Privacy Policy. Visit the following website, www.allaboutdnt.org, for more information on this developing area.
quicksetup.lang_wiz_privacy_policy_content94=In addition to Belkin's use of web beacons on Belkin websites, we allow certain third parties who provide Belkin advertising on their websites to use their own web beacons within Belkin websites. In that case, if you click on or view a Belkin ad on one of our advertising partners' websites and are redirected or go to the Belkin website, the advertising partner places a web beacon on your browser so that we can track advertising conversions (which let us know if an ad was effective). These web beacons will appear on your browser regardless of whether you have refused to accept cookies or indicated that you do not want to be tracked on Belkin websites or on the Internet generally. However, they are only used by Belkin for the limited purpose of tracking advertising conversions and do not identify you personally in any way.
quicksetup.lang_wiz_privacy_policy_content95=Third parties may collect information about your online activities over time and across different websites when you use Belkin websites. To avoid tracking by these third parties, you can exercise the choices above to reject cookies, although Belkin has no control over and cannot confirm whether these third parties honor the do not track browser choices you have made.
quicksetup.lang_wiz_privacy_policy_content96=Security
quicksetup.lang_wiz_privacy_policy_content97=We strive to maintain reasonable administrative, technical and physical safeguards designed to protect the information collected by Belkin websites and Belkin Products. Unfortunately, the transmission of information via the Internet is not 100% secure. Although we will do our best to protect your Personal Information, we cannot guarantee its security\; any transmission is at your own risk.
quicksetup.lang_wiz_privacy_policy_content98=It is important to note that if you use a computer or device that can be accessed by others, other people may be able to access unencrypted Personal Information. If you do not want your information to be available to others, exercise caution when using public computers or devices or when using any computer or device to which users unauthorized by you may have access.
quicksetup.lang_wiz_privacy_policy_content99=We recommend that you take every precaution in protecting your Personal Information when you are on the Internet. For example, change your passwords often, use a combination of letters and numbers when creating passwords, and make sure you use a secure browser. You should also be aware that names that you give your Wi-Fi-enabled devices, home networks and services (also known as "friendly names") may be detectable by others outside your home, so you should not use Personal Information as part of your friendly names.
quicksetup.lang_wiz_privacy_policy_content100=Updates and Upgrades
quicksetup.lang_wiz_privacy_policy_content101=Belkin Products may be updated or upgraded from time to time to provide additional features, address technical issues, and generally make your user experience better. Some Belkin Products include an auto-update feature, which gives us the ability to make updates automatically. You can change auto-update options by changing your settings within the Belkin Product account information. In very limited cases, updates may still be automatically applied, regardless of the auto-update setting. For example, we may provide an automatic update that prevents or fixes a security vulnerability or breach to your network.
quicksetup.lang_wiz_privacy_policy_content102=Third Party and Social Media Linked Sites
quicksetup.lang_wiz_privacy_policy_content103=Belkin websites and online services may contain links to websites or online services operated by third parties. Belkin Products may also use or offer products and services from third parties, such as a third party app that works with a Belkin Product. Once you leave Belkin websites and Belkin Products, your activities are governed by the terms of use and privacy policies of the third party websites and online services. Belkin is not responsible for the privacy practices or the content of these websites and online services, and we encourage you to carefully read the terms of use and privacy policies of any website and online service you visit.
quicksetup.lang_wiz_privacy_policy_content104=Belkin websites and Belkin Products may contain social media features, such as Facebook "Like" buttons. These features may collect information about your device's IP address, set cookies to facilitate interaction with social media features or link you to a social media website where you may post Personal Information. All interactions with social media features are governed by the privacy policy of the social media company providing the feature.
quicksetup.lang_wiz_privacy_policy_content105=Forums/Chat Rooms
quicksetup.lang_wiz_privacy_policy_content106=If you participate in or post information to a discussion forum or chat room on any Belkin website or Belkin Product, you should be aware that the information you provide there will be made broadly available to others, and can be read, collected, forwarded or used by other users of these forums, potentially inside or outside Belkin, who have access to that forum. This information could also be used to send you unsolicited messages. Please recognize that individual forums may have additional rules and conditions. Each participant's opinion on a forum or chat room is his or her own and should not be considered as reflecting the opinion of Belkin. We are not responsible for Personal Information or any other information you may choose to submit in these forums, or the consequences of any submission. If at any time you would like to remove a posting, please email us at privacy@belkin.com. Keep in mind that removal of a posting from a forum or chat room does not mean that the posting will be deleted from our systems, or that it has been completely removed from the Internet.
quicksetup.lang_wiz_privacy_policy_content107=Updates to this Privacy Policy
quicksetup.lang_wiz_privacy_policy_content108=We may update this Privacy Policy from time to time, so please review it frequently. If we change our Privacy Policy, we will post the revised version here, with an updated revision date. If we make material changes to our Privacy Policy, we will notify you by email or prominently post a notice on this website.
quicksetup.lang_wiz_privacy_policy_content109=How to Contact Us
quicksetup.lang_wiz_privacy_policy_content110=Should you have any privacy-related questions or comments related to this Privacy Policy, please contact us at privacy@belkin.com. If you are located in Singapore, you may contact Alison Tan at privacy.sg@belkin.com if you have any privacy-related questions or comments.
quicksetup.lang_wiz_privacy_policy_content111=If you have complaints or concerns about this Privacy Policy, please contact us at the above email. We treat all complaints about a breach of the privacy laws seriously. Someone from Belkin will investigate your complaint and respond to you within a reasonable time.
quicksetup.lang_wiz_privacy_policy_content112=Updated October 20, 2014
