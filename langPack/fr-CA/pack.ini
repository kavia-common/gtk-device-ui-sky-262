wizard.lang_tooltip_wifinetwork_pmf=Les cadres de gestion protégés (PMF) sécurisent le Wi‑Fi en chiffrant les trames de gestion critiques, en bloquant les attaques usurpées pouvant déconnecter les utilisateurs et en assurant des connexions stables et privées.
wizard.lang_tooltip_wifinetwork_psc=Le canal de balayage privilégié (PSC) est un ensemble de canaux 6 GHz prioritaires qui aident les appareils Wi‑Fi 6E/7 à se connecter plus rapidement et de façon plus fiable en réduisant le temps de balayage et en évitant les interférences.
wizard.lang_tooltip_smartmesh=Lorsque Smart Mesh est activé, votre routeur devient le contrôleur Mesh. Après l’installation, vous pouvez ajouter des appareils agents Mesh compatibles en tout temps pour une couverture complète de la maison.
wizard.lang_tooltip_wifinetwork_common=Lorsque Smart Connect est activé, toutes les bandes (2,4 GHz, 5 GHz et 6 GHz) partagent un seul nom Wi‑Fi et vos appareils clients se connecteront automatiquement à la meilleure bande. Vous pouvez désactiver Smart Connect si vous souhaitez configurer séparément chaque bande (2,4 GHz, 5 GHz, 6 GHz).
wizard.lang_tooltip_wifinetwork_mlo=Le fonctionnement multi‑liaisons (MLO) permet aux appareils Wi‑Fi 7 de se connecter simultanément sur les bandes 2,4, 5 et 6 GHz — offrant des vitesses plus rapides, une latence réduite et une fiabilité accrue pour la RV/RA, les jeux, le télétravail et l’informatique en nuage.
wizard.lang_pppoe_help_msg=Saisissez votre nom d’utilisateur et votre mot de passe PPPoE. Vous ne les avez pas ? Communiquez avec votre FAI pour obtenir de l’aide.
wizard.lang_mode_select_warning_msg=Veuillez sélectionner le mode de l’appareil !
wizard.lang_pmf_tittle=PMF requis
wizard.lang_tooltip_wifinetwork_pmf_required=PMF requis signifie que l’appareil rejettera toute connexion sans PMF. Désactiver ce réglage signifie que le PMF pour le client est optionnel.<br>PMF est toujours activé lorsque WPA3 est sélectionné.
